<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Molat</title>
  </head>
  <body>
    <div id="lobbyScreen">
      <h1>Welcome to Molat Game</h1>

      <label>
        <input type="radio" name="mode" value="host" checked /> Host Game
      </label>
      <label> <input type="radio" name="mode" value="join" /> Join Game </label>

      <form id="gameForm">
        <div>
          <label>Username:</label>
          <input type="text" name="username" required />
        </div>

        <div id="codeField" style="display: none">
          <label>Game Code:</label>
          <input type="text" name="code" />
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>
    <div id="gameScreen" style="display: none">
      <h1 class="title" id="title">Molat Game</h1>
      <h2 class="code" id="code"></h2>
      <div id="timer">
        <h3>Time Left: <span id="timeLeft">60</span>s</h3>
      </div>
      <div id="gmControls">
        <button id="setQuestionBtn" class="setQuestionBtn">
          Click to set Question
        </button>
      </div>
      <div class="main">
        <div class="name">
          <span><i class="far fa-user" aria-hidden="true"></i></span>
          <p class="name-input" id="name-input"></p>
          <button class="leave" id="leave">leave game</button>
        </div>
        <ul class="message-container" id="message-container">
          <li class="message-feedback-top" id="message-feedback-top">
            <p class="feedback-top" id="feedback-top"></p>
          </li>
          <!-- <li class="message-left">
            <p class="message" id="message-left">
              lorem impsum 
              <span></span>
            </p> 
          </li> -->
          <!-- <li class="message-right">
            <p class="message" id="message-right">
              lorem impsum
              <span></span>
            </p>
          </li> -->
          <li class="message-feedback">
            <p class="feedback" id="feedback"></p>
          </li>
        </ul>
        <div>
          <form class="message-form" id="message-form">
            <input
              type="text"
              name="message"
              id="message-input"
              class="message-input"
            />
            <div class="v-divider"></div>
            <button type="submit" class="send-button">
              send <span><i class="fas fa-paper-plane"></i></span>
            </button>
          </form>
        </div>
      </div>

      <ul id="scoresList">
        <li class="playerscores" id="playerScores"></li>
      </ul>
      <div id="popover" class="popover hidden">
        <label>Question:</label>
        <input
          type="text"
          id="questionInput"
          placeholder="Enter your question here"
        />

        <label>Answer:</label>
        <input
          type="text"
          id="answerInput"
          placeholder="Enter your answer here"
        />

        <div>
          <button id="submitQA">Submit</button>
          <button id="closePopover">Cancel</button>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"
      integrity="sha512-QoJS4DOhdmG8kbbHkxmB/rtPdN62cGWXAdAFWWJPvUFF1/zxcPSdAnn4HhYZSIlVoLVEJ0LesfNlusgm2bPfnA=="
      crossorigin="anonymous"
    ></script>
    <script src="./index.js"></script>
    <script src="./user.js"></script>

  </body>
</html>
